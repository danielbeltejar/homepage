apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-runtime-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  runtime-config.js: |
    window.__DANIEL_CONFIG__ = {
      clarityProjectId: {{ .Values.clarityProjectId | default "" | quote }}
    };
