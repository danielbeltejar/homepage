services:
  posts:
    build:
      context: ./posts
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8000"
    volumes:
      - posts-data:/app/posts:ro
      - ./posts:/app/src:ro
    environment:
      POSTS_DIR: /app/posts
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  admin-back:
    build:
      context: ./admin-back
      dockerfile: Dockerfile.dev
    ports:
      - "8002:8000"
    volumes:
      - posts-data:/app/posts
      - ./admin-back:/app/src
    env_file:
      - admin.env
    environment:
      POSTS_DIR: /app/posts
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  admin-front:
    build:
      context: ./admin-front
      dockerfile: Dockerfile.dev
    ports:
      - "3001:8080"
    volumes:
      - ./admin-front/src:/app/src
    depends_on:
      admin-back:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    ports:
      - "3000:5173"
    volumes:
      - ./front/src:/app/src
      - ./front/public:/app/public
      - ./front/index.html:/app/index.html
      - ./front/vite.config.js:/app/vite.config.js
      - ./front/tailwind.config.js:/app/tailwind.config.js
      - ./front/postcss.config.js:/app/postcss.config.js
      - ./front/package.json:/app/package.json
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  posts-data:
